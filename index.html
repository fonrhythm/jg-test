<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JossGawin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Outfit:wght@100;200;300;400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --night-bg-0:#111115;--night-bg-1:#1C1B24;--night-bg-2:#28263A;
  --night-purple-mid:#7A6EA8;--night-purple-fog:#B8B0D4;--night-white:#E2DFEF;
  --day-bg-0:#F7F9F7;--day-bg-1:#EDF3EE;--day-bg-2:#E4EFE6;
  --day-green-core:#7BB08A;--day-green-deep:#4D8A62;--day-black:#1A1C1A;
  --ease:cubic-bezier(0.4,0,0.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:'Outfit',sans-serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
body.night{background:radial-gradient(ellipse at 30% 40%,#28263A 0%,#1C1B24 45%,#111115 100%);}
body.day  {background:radial-gradient(ellipse at 70% 60%,#E4EFE6 0%,#EDF3EE 45%,#F7F9F7 100%);}

#splash{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;
  text-align:center;
  cursor:pointer;
  opacity:1;transition:opacity 1.2s var(--ease);
}
#splash.gone{opacity:0;pointer-events:none;}

.splash-tagline{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  text-align:center;
  opacity:0;animation:tagFade 1.6s ease 0.4s forwards;
}
@keyframes tagFade{to{opacity:1;}}

.tag-en{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-weight:300;font-size:clamp(18px,3.5vw,28px);letter-spacing:0.06em;
}
.tag-zh{font-weight:200;font-size:clamp(12px,1.8vw,16px);letter-spacing:0.22em;}
.tag-th{font-weight:200;font-size:clamp(11px,1.6vw,14px);letter-spacing:0.1em;opacity:0.8;}
body.night .tag-en{color:var(--night-white);}
body.night .tag-zh{color:var(--night-purple-fog);}
body.night .tag-th{color:var(--night-purple-mid);}
body.day   .tag-en{color:var(--day-black);}
body.day   .tag-zh{color:var(--day-green-deep);}
body.day   .tag-th{color:var(--day-green-core);}

.splash-div{
  width:0.5px;height:0;margin:22px 0;
  opacity:0;animation:divGrow 1s ease 1.8s forwards;
}
@keyframes divGrow{to{height:44px;opacity:1;}}
body.night .splash-div{background:rgba(226,223,239,0.25);}
body.day   .splash-div{background:rgba(26,28,26,0.18);}

.splash-welcome{
  font-family:'Great Vibes',cursive;
  font-size:clamp(30px,4.5vw,50px);
  opacity:0;animation:welcomeIn 1.4s ease 2.6s forwards;
}
@keyframes welcomeIn{to{opacity:0.85;}}
body.night .splash-welcome{color:var(--night-purple-fog);}
body.day   .splash-welcome{color:var(--day-green-deep);}

.splash-hint{
  position:absolute;bottom:44px;
  font-size:9px;font-weight:200;letter-spacing:0.4em;text-transform:uppercase;
  opacity:0;animation:hintPulse 2.5s ease 3.8s infinite;
  pointer-events:none;
}
@keyframes hintPulse{0%{opacity:0;}30%{opacity:0.6;}70%{opacity:0.6;}100%{opacity:0;}}
body.night .splash-hint{color:var(--night-purple-fog);}
body.day   .splash-hint{color:var(--day-green-core);}
</style>
</head>
<body>
<div id="splash" onclick="enter()">
  <div class="splash-tagline">
    <span class="tag-en">You're special.</span>
    <span class="tag-zh">你是最特别的</span>
    <span class="tag-th">คุณคือคนพิเศษที่สุด</span>
  </div>
  <div class="splash-div"></div>
  <div class="splash-welcome">Welcome Home</div>
  <div class="splash-hint">tap anywhere</div>
</div>
<script>
const hr = new Date().getHours();
document.body.classList.add(hr >= 18 || hr < 6 ? 'night' : 'day');

function enter(){
  document.getElementById('splash').classList.add('gone');
  setTimeout(() => { window.location.href = 'pages/index.html'; }, 1000);
}
</script>
</body>
</html>
